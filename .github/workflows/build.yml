name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer virtualenv

      # ▼▼▼ ЭТОТ ШАГ БЫЛ ПРОПУЩЕН — ОН ГЕНЕРИРУЕТ ИКОНКУ И СПЛЭШ ▼▼▼
      - name: Generate app assets (icon + presplash)
        run: |
          python -m pip install Pillow
          python make_assets.py
      # ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

      - name: Cache global Buildozer files
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache project Buildozer files
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-project-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-project-

      - name: Clean previous output
        run: |
          rm -rf bin build.log

      - name: Show Java version
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          unset ANDROID_SDK_ROOT || true
          unset ANDROID_NDK_ROOT || true
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Xmx3g"
          java -version
          buildozer android debug 2>&1 | tee build.log

      - name: List bin directory
        if: always()
        run: |
          ls -lah bin || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: routetracker-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Prepare failure logs
        if: failure()
        run: |
          grep -n -E "FAILURE:|What went wrong|error:|ERROR|Exception|Command failed|Traceback|ModuleNotFoundError" build.log > build-errors.txt || true
          tail -n 30000 build.log > build-tail.log || true
          gzip -9 build-errors.txt || true
          gzip -9 build-tail.log || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-errors.txt.gz
            build-tail.log.gz
          if-no-files-found: ignore
